# SPDX-License-Identifier: MIT
name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    # Stable releases publish here; prereleases remain available on GitHub.
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    # Private evaluation never publishes to a public package index.
    if: ${{ !github.event.repository.private && vars.PYPI_PUBLISH_ENABLED == 'true' }}
    name: Publish validated artifacts
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mbmerge/
    permissions:
      id-token: write
    steps:
      # Publishing has no source checkout or build commands. It receives the
      # exact artifacts from this run after all reusable CI jobs have succeeded.
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
